name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and export to tar
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: messagewall:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/messagewall-latest.tar

      - name: Upload to Release
        run: |
          # 获取仓库信息
          REPO="gybeyond1/messagewall"
          TAG="v1.0.0"
          FILE="/tmp/messagewall-latest.tar"
          
          # 检查文件是否存在
          ls -lh "$FILE"
          
          # 获取 release ID
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" | jq -r '.id')
          
          echo "Release ID: $RELEASE_ID"
          
          # 上传 asset
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$FILE" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=messagewall-latest.tar"
          
          echo "✅ Upload complete!"

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: gybeyond/messagewall:latest
          cache-from: type=gha
