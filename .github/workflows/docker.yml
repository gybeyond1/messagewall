name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: gybeyond/messagewall:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image and upload to Release
        run: |
          docker pull gybeyond/messagewall:latest
          docker save gybeyond/messagewall:latest -o messagewall-latest.tar
          ls -lh messagewall-latest.tar

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          files: messagewall-latest.tar
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
