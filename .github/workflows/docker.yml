name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: messagewall:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tar
        run: |
          docker save messagewall:latest -o messagewall-latest.tar
          ls -lh messagewall-latest.tar
          echo "FILE_SIZE=$(stat -c%s messagewall-latest.tar)" >> $GITHUB_ENV

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: gybeyond1/messagewall
          TAG: v1.0.0
        run: |
          # 获取 release ID
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPO/releases/tags/$TAG" | jq -r '.id')
          
          echo "Release ID: $RELEASE_ID"
          echo "File size: $FILE_SIZE bytes"
          
          # 上传 asset
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"messagewall-latest.tar" \
            "https://uploads.github.com/repos/$GITHUB_REPO/releases/$RELEASE_ID/assets?name=messagewall-latest.tar"
          
          echo "✅ Upload complete!"

      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: gybeyond/messagewall:latest
          cache-from: type=gha
