version: '3.8'

services:
  messagewall:
    build: .
    container_name: messagewall
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-false}
      - DB_PATH=/app/data/messages.db
    volumes:
      - ./data:/app/data
