<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #f3e5f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 32px 28px 24px;
      text-align: center;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 13px;
      opacity: 0.85;
    }

    .card-body {
      padding: 28px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .field label .required {
      color: #e74c3c;
      margin-left: 2px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background: #fafafa;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
      background: #fff;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #aaa;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    /* 图片上传区 */
    .upload-area {
      border: 1.5px dashed #d0d0d0;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fafafa;
      position: relative;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: #f5f3ff;
    }

    .upload-area.has-image {
      padding: 8px;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      border: none;
      box-shadow: none;
      padding: 0;
      background: transparent;
    }

    .upload-area input[type="file"]:focus {
      border: none;
      box-shadow: none;
    }

    .upload-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .upload-text {
      font-size: 13px;
      color: #999;
    }

    .upload-preview {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      display: none;
    }

    .upload-preview.show {
      display: block;
      margin: 0 auto;
    }

    .upload-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .upload-area.has-image .upload-remove { display: flex; }
    .upload-area.has-image .upload-icon,
    .upload-area.has-image .upload-text { display: none; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 成功提示 */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .success-overlay.show { display: flex; }

    .success-box {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-box .icon {
      font-size: 52px;
      margin-bottom: 16px;
    }

    .success-box h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    .success-box p {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }

    .success-box button {
      padding: 10px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .error-msg {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>📮 留言板</h1>
      <p>写下你想说的话，我会转达给主人</p>
    </div>
    <div class="card-body">
      <form id="msgForm">
        <div class="field">
          <label>怎么称呼您？<span class="required">*</span></label>
          <input type="text" id="name" placeholder="请输入您的称呼" maxlength="30" required>
          <div class="error-msg" id="nameErr">请输入您的称呼</div>
        </div>

        <div class="field">
          <label>留言内容<span class="required">*</span></label>
          <textarea id="content" placeholder="写下你想说的话..." maxlength="500" required></textarea>
          <div class="error-msg" id="contentErr">请输入留言内容</div>
        </div>

        <div class="field">
          <label>联系方式 <span style="color:#bbb;font-weight:400">(选填)</span></label>
          <input type="text" id="contact" placeholder="手机号、微信号等" maxlength="50">
        </div>

        <div class="field">
          <label>添加图片 <span style="color:#bbb;font-weight:400">(选填)</span></label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="imageInput" accept="image/*" capture="environment">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击拍照或选择图片</div>
            <img class="upload-preview" id="preview" alt="预览">
            <button type="button" class="upload-remove" id="removeBtn">✕</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">提交留言</button>
      </form>
    </div>
  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-box">
      <div class="icon">✅</div>
      <h2>留言已提交！</h2>
      <p>感谢您的留言，主人会尽快看到的~</p>
      <button onclick="location.reload()">再写一条</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('msgForm');
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');
    const preview = document.getElementById('preview');
    const removeBtn = document.getElementById('removeBtn');
    let selectedFile = null;

    imageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.classList.add('show');
        uploadArea.classList.add('has-image');
      };
      reader.readAsDataURL(file);
    });

    removeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      selectedFile = null;
      imageInput.value = '';
      preview.src = '';
      preview.classList.remove('show');
      uploadArea.classList.remove('has-image');
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const content = document.getElementById('content').value.trim();
      const contact = document.getElementById('contact').value.trim();

      let valid = true;
      document.getElementById('nameErr').style.display = 'none';
      document.getElementById('contentErr').style.display = 'none';

      if (!name) {
        document.getElementById('nameErr').style.display = 'block';
        valid = false;
      }
      if (!content) {
        document.getElementById('contentErr').style.display = 'block';
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      const formData = new FormData();
      formData.append('name', name);
      formData.append('content', content);
      formData.append('contact', contact);
      if (selectedFile) formData.append('image', selectedFile);

      try {
        const res = await fetch('/api/message', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          document.getElementById('successOverlay').classList.add('show');
        } else {
          alert('提交失败，请重试');
        }
      } catch (err) {
        alert('网络错误，请检查连接后重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '提交留言';
      }
    });
  </script>
</body>
</html>
