<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e8ebf3">
  <title>留言板</title>
  <style>
    :root {
      --bg: #e8ebf3;
      --surface: #e8ebf3;
      --shadow-light: #ffffff;
      --shadow-dark: #c2c8d6;
      --text: #41485a;
      --text-soft: #828aa0;
      --text-faint: #aab0c0;
      --accent: #6c5ce7;
      --accent-strong: #5b4fd6;
      --danger: #e15a6d;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 适配刘海/灵动岛安全区 */
      padding: calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 新拟态卡片：从背景"凸出" ===== */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 26px 22px;
      box-shadow:
        14px 14px 28px var(--shadow-dark),
        -14px -14px 28px var(--shadow-light);
    }

    .card-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .card-header .badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: var(--surface);
      box-shadow:
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
    }

    .card-header h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 13px;
      color: var(--text-soft);
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .field label .required { color: var(--danger); margin-left: 3px; }
    .field label .optional { color: var(--text-faint); font-weight: 400; margin-left: 4px; font-size: 12px; }

    /* ===== 输入框：新拟态"按进去" ===== */
    .field input,
    .field textarea {
      width: 100%;
      padding: 15px 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px; /* ≥16px 防止 iOS 聚焦时自动放大 */
      color: var(--text);
      background: var(--surface);
      outline: none;
      line-height: 1.5;
      box-shadow:
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
      transition: box-shadow 0.2s ease;
    }

    .field input::placeholder,
    .field textarea::placeholder { color: var(--text-faint); }

    .field input:focus,
    .field textarea:focus {
      box-shadow:
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light),
        0 0 0 2px rgba(108,92,231,0.35);
    }

    .field textarea {
      min-height: 104px;
      resize: none;
    }

    /* ===== 图片上传区：同样按进去的风格 ===== */
    .upload-area {
      border: none;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      background: var(--surface);
      box-shadow:
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
      position: relative;
      transition: box-shadow 0.2s ease;
    }

    .upload-area:active {
      box-shadow:
        inset 6px 6px 10px var(--shadow-dark),
        inset -6px -6px 10px var(--shadow-light);
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      border: none;
      box-shadow: none;
      padding: 0;
      background: transparent;
    }

    .upload-icon {
      font-size: 30px;
      margin-bottom: 8px;
      /* 图标也做出一点点浮雕感 */
      filter: drop-shadow(2px 2px 2px var(--shadow-dark)) drop-shadow(-1px -1px 1px var(--shadow-light));
    }

    .upload-text { font-size: 13px; color: var(--text-soft); }

    .upload-preview {
      max-width: 100%;
      max-height: 180px;
      border-radius: 12px;
      display: none;
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    }

    .upload-preview.show { display: block; margin: 0 auto; }

    .upload-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--surface);
      color: var(--text-soft);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 15px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    }
    .upload-remove:active {
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    }

    .upload-area.has-image { padding: 10px; }
    .upload-area.has-image .upload-remove { display: flex; }
    .upload-area.has-image .upload-icon,
    .upload-area.has-image .upload-text { display: none; }

    /* ===== 提交按钮：凸出 + 主题色 ===== */
    .btn-submit {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      padding: 14px;
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      background: linear-gradient(145deg, #7b6cf0, var(--accent-strong));
      box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
      transition: box-shadow 0.12s ease, transform 0.12s ease;
    }

    .btn-submit:active {
      transform: scale(0.985);
      box-shadow: inset 5px 5px 10px rgba(0,0,0,0.18), inset -5px -5px 10px rgba(255,255,255,0.18);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    }

    /* ===== 成功弹层 ===== */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(232,235,243,0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }
    .success-overlay.show { display: flex; }

    .success-box {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 38px 30px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 14px 14px 28px var(--shadow-dark), -14px -14px 28px var(--shadow-light);
      animation: pop 0.32s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes pop {
      from { transform: scale(0.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-box .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: var(--surface);
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    }

    .success-box h2 { font-size: 19px; color: var(--text); margin-bottom: 8px; }
    .success-box p { font-size: 14px; color: var(--text-soft); margin-bottom: 22px; line-height: 1.6; }

    .success-box button {
      padding: 13px 36px;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(145deg, #7b6cf0, var(--accent-strong));
      box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
    }
    .success-box button:active {
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.18), inset -4px -4px 8px rgba(255,255,255,0.18);
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    /* 超小屏微调 */
    @media (max-width: 360px) {
      .card { padding: 22px 16px; border-radius: 18px; }
      .card-header .badge { width: 50px; height: 50px; font-size: 23px; }
      .card-header h1 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="badge">📮</div>
      <h1>留言板</h1>
      <p>写下你想说的话，我会转达给主人</p>
    </div>
    <div class="card-body">
      <form id="msgForm">
        <div class="field">
          <label>怎么称呼您？<span class="required">*</span></label>
          <input type="text" id="name" placeholder="请输入您的称呼" maxlength="30" required>
          <div class="error-msg" id="nameErr">请输入您的称呼</div>
        </div>

        <div class="field">
          <label>留言内容 <span class="optional">选填，或与图片二选一</span></label>
          <textarea id="content" placeholder="写下你想说的话...（也可只发图片）" maxlength="500"></textarea>
          <div class="error-msg" id="contentErr">请填写内容或添加图片</div>
        </div>

        <div class="field">
          <label>联系方式 <span class="optional">选填</span></label>
          <input type="text" id="contact" placeholder="手机号、微信号等" maxlength="50">
        </div>

        <div class="field">
          <label>添加图片 <span class="optional">选填</span></label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="imageInput" accept="image/*" capture="environment">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击拍照或选择图片</div>
            <img class="upload-preview" id="preview" alt="预览">
            <button type="button" class="upload-remove" id="removeBtn">✕</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">提交留言</button>
      </form>
    </div>
  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-box">
      <div class="icon">✅</div>
      <h2>留言已提交！</h2>
      <p>感谢您的留言，主人会尽快看到的~</p>
      <button onclick="location.reload()">再写一条</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('msgForm');
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');
    const preview = document.getElementById('preview');
    const removeBtn = document.getElementById('removeBtn');
    let selectedFile = null;

    imageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.classList.add('show');
        uploadArea.classList.add('has-image');
      };
      reader.readAsDataURL(file);
    });

    removeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      selectedFile = null;
      imageInput.value = '';
      preview.src = '';
      preview.classList.remove('show');
      uploadArea.classList.remove('has-image');
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const content = document.getElementById('content').value.trim();
      const contact = document.getElementById('contact').value.trim();

      let valid = true;
      document.getElementById('nameErr').style.display = 'none';
      document.getElementById('contentErr').style.display = 'none';

      if (!name) {
        document.getElementById('nameErr').style.display = 'block';
        valid = false;
      }
      if (!content && !selectedFile) {
        document.getElementById('contentErr').style.display = 'block';
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      const formData = new FormData();
      formData.append('name', name);
      formData.append('content', content);
      formData.append('contact', contact);
      if (selectedFile) formData.append('image', selectedFile);

      try {
        const res = await fetch('/api/message', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          document.getElementById('successOverlay').classList.add('show');
        } else {
          alert('提交失败，请重试');
        }
      } catch (err) {
        alert('网络错误，请检查连接后重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '提交留言';
      }
    });
  </script>
</body>
</html>
